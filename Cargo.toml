[package]
name = "rust-mediaplayer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "RustMediaPlayer"
path = "src/main.rs"

[dependencies]
# Window, input and UI (OpenGL). Default features off: drops the screen-reader
# bridge and Linux-only window backends the player doesn't use ("x11" only
# matters when checking the code on Linux)
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts", "x11"] }

# OpenGL paint callbacks (video, frosted glass, thumbnails)
egui_glow = "0.27"

# Rust bindings to libmpv (the DLL itself comes from the mpv builds); "render"
# adds the OpenGL render API the video is drawn with
libmpv2 = { version = "7.0.1", features = ["render"] }

# The native window handle (HWND), for the Windows integration in taskbar.rs
raw-window-handle = "0.6"

# Reading yt-dlp's details about a link (info panel, error messages, thumbnails)
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
# Embeds assets/icon.ico into the .exe
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true              # optimise across crates
codegen-units = 1       # slower build, faster program
panic = "abort"         # smaller binary
strip = true            # no debug symbols in the .exe
